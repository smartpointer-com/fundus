# Fundus configuration (TOML). Copy to ~/.config/fundus.toml and edit.
# Every path below is an EXAMPLE — point them at your own corpus locations.

[meilisearch]
url   = "http://127.0.0.1:7700"
index = "corpus"
# api_key = "..."          # or set FUNDUS_MEILI_KEY in the environment

[embedder]
# A bare-metal, OpenAI-compatible embeddings endpoint (e.g. MLX / llama.cpp / Ollama).
url   = "http://127.0.0.1:8081/v1/embeddings"
model = "qwen3-embedding"
# api_key = "..."          # or set FUNDUS_EMBED_KEY if the endpoint requires a bearer token
# query_url   = "..."      # host-side embedder URL for Fundus's own query embedding, if it differs
#                          # from `url` (e.g. Meili-in-Docker uses host.docker.internal, host uses 127.0.0.1)
# query_prompt = "Instruct: Given a web search query, retrieve relevant passages that answer the query\nQuery: "
#                          # instruct prefix for QUERIES only (models like Qwen3-Embedding); empty = symmetric

[extractor]
default = "docling-serve"        # swap freely; the cache is keyed per engine

[extractor.engines.docling-serve]
url = "http://127.0.0.1:5001"

[extractor.engines.tika]
url = "http://127.0.0.1:9998"

# --- Sources (pluggable). Add as many as you like, of any supported type. ---

[[sources]]
name  = "mail"
type  = "notmuch"
db    = "/path/to/maildir"       # a notmuch-indexed maildir
query = "*"

[[sources]]
name = "chat"
type = "wacli"
db   = "/path/to/whatsapp.db"    # a wacli SQLite database (opened read-only)

[sources.window]
target_tokens  = 512
max_tokens     = 1024
overlap        = 2
soft_gap_hours = 24

[[sources]]
name  = "documents"
type  = "files"
roots = ["/path/to/documents", "/path/to/more/documents"]
