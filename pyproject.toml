[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fundus"
version = "0.0.0"
description = "Pluggable toolkit for indexing a heterogeneous corpus (email, chat, documents) into Meilisearch for full-text and hybrid semantic search."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "pydantic>=2.6",
  "httpx>=0.27",
  "tenacity>=8.2",
  "meilisearch>=0.31",
  "selectolax>=0.3",
  "python-calamine>=0.2",
  "puremagic>=1.27",
  "structlog>=24.1",
  "mcp>=1.0",
  "markdown-it-py>=3.0",
]

[project.optional-dependencies]
judge = ["openai>=1.30"]
tokenize = ["tokenizers>=0.19"]  # accurate token budgets; heuristic used otherwise
dev = [
  "pytest>=8.0",
  "pytest-httpx>=0.30",
  "testcontainers>=4.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
fundus = "fundus.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/fundus"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["meilisearch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
