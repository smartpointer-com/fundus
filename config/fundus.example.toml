# Fundus configuration (TOML). Copy to ~/.config/fundus.toml and edit.
# Every path below is an EXAMPLE — point them at your own corpus locations.

# env_file = "~/.config/fundus.env"    # a KEY=VALUE secrets file every fundus process sources at
#                          # startup if it exists — so FUNDUS_MEILI_KEY / FUNDUS_SERVE_TOKEN /
#                          # FUNDUS_EMBED_KEY live in one file, not your shell. Override: $FUNDUS_ENV_FILE.

# [service]                # defaults for `fundus service install` (launchd jobs); each is also a flag
# label_prefix = "fundus"  # job labels become <prefix>.index / .index-full / .serve (use reverse-DNS)
# interval_minutes = 30    # incremental indexing cadence
# full_at = "03:00"        # nightly full-reconcile time (HH:MM); set it AFTER your corpus sync finishes

# [service.docling]        # OPTIONAL keep-alive job for a BARE-METAL docling-serve, managed alongside
# enabled = true           # the index/serve jobs. On Apple Silicon the container can't reach Apple
# command = ["/path/to/venv/bin/docling-serve", "run", "--host", "127.0.0.1", "--port", "5001"]
#                          # Vision (ocrmac) or the GPU, so you run docling-serve on the host and
#                          # point [extractor.engines.docling-serve].url at it. Command/env are yours.
# [service.docling.environment]
# PATH = "/path/to/venv/bin:/opt/homebrew/bin:/usr/bin:/bin"   # e.g. put the venv on PATH

# [storage]
# data_dir = "~/fundus"    # single root for ALL Fundus runtime data — the search index, the
#                          # extraction/embedding caches, the per-source cursors, and the run lock,
#                          # each in a subdirectory. Default: $XDG_DATA_HOME/fundus
#                          # (~/.local/share/fundus). The Meili index lives at <data_dir>/meili;
#                          # `make up` mounts it automatically (see `fundus paths`).

# [serve]                  # the read-only MCP server (`fundus serve`) and the thin client
# host = "127.0.0.1"
# port = 8181
# transport = "streamable-http"   # durable; "sse" (legacy) or "stdio" also supported
# token = "..."            # bearer token clients must present (or set FUNDUS_SERVE_TOKEN); this is
#                          # the key you share with OpenClaw. Required for the HTTP transports.
# url = "..."              # client-side only: full endpoint of a running server (else host/port)

[meilisearch]
url   = "http://127.0.0.1:7700"
index = "corpus"
# api_key    = "..."       # ADMIN/write key (indexer + monolithic server); or set FUNDUS_MEILI_KEY
# search_key = "..."       # OPTIONAL read-only SEARCH key; or set FUNDUS_MEILI_SEARCH_KEY. The MCP
#                          # server prefers it but falls back to api_key — set it only when you split
#                          # the server out to a less-trusted process. Must be a real Meili key.

[embedder]
# A bare-metal, OpenAI-compatible embeddings endpoint (e.g. MLX / llama.cpp / Ollama).
url   = "http://127.0.0.1:8081/v1/embeddings"
model = "qwen3-embedding"
# dimensions = 1024        # the model's vector size; REQUIRED when fanout is on (userProvided embedder)
# api_key = "..."          # or set FUNDUS_EMBED_KEY if the endpoint requires a bearer token
# query_url   = "..."      # host-side embedder URL for Fundus's own query embedding, if it differs
#                          # from `url` (e.g. Meili-in-Docker uses host.docker.internal, host uses 127.0.0.1)
# query_prompt = "Instruct: Given a web search query, retrieve relevant passages that answer the query\nQuery: "
#                          # instruct prefix for QUERIES only (models like Qwen3-Embedding); empty = symmetric
# fanout = true            # Fundus computes document vectors itself (concurrently) and stores them via a
#                          # userProvided embedder, bypassing Meili's one-request-at-a-time REST path — a big
#                          # win on a heavy model. Needs `dimensions`; set `query_prompt` too for instruct
#                          # models (empty = symmetric). A SQLite vector cache then makes re-indexes cheap
#                          # (seed it once with `fundus embed-backfill`).

[extractor]
default = "docling-serve"        # or "escalate" (below); the cache is keyed per engine

[extractor.engines.docling-serve]
url = "http://127.0.0.1:5001"
# max_concurrency = 2      # cap concurrent requests to docling (it drops queued connections when flooded);
#                          # a request that hits a resource/time limit is then retried exclusively
# timeout = 960            # client read timeout (s); keep above docling's max_sync_wait for large-scan OCR
# ocr_engine = "ocrmac"    # OCR engine docling-serve should use (sent per request; default: let it choose).
#                          # Set "ocrmac" to use Apple Vision on a BARE-METAL macOS docling-serve — faster
#                          # and better on mixed-language scans than the container default (EasyOCR on CPU),
#                          # which can't reach Vision. Leave unset for any containerized/Linux deployment.
#                          # Changing this marks the documents this engine produced as stale (extract_sig):
#                          # the next `fundus index --full` re-parses exactly those, no cache surgery needed.
#                          # (Engine UPGRADES never auto-re-parse; use `fundus reparse --ocr-only` when one
#                          # seems worth it.)

[extractor.engines.tika]
url = "http://127.0.0.1:9998"

# Escalating router: run `fast` first and fall back to `quality` only when the result is too sparse
# (a scanned PDF needing OCR) — ~tika speed with docling fidelity where it matters. Set the extractor
# `default = "escalate"` above to use it.
# [extractor.router]
# fast = "tika"
# quality = "docling-serve"
# min_chars = 100
# max_bytes = 35_000_000  # never escalate files above this size — a sparse result on a very large
#                         # file is typically a whole scanned book, and OCRing it can crash the
#                         # quality engine (which then also kills every in-flight conversion)

# --- Sources (pluggable). Add as many as you like, of any supported type. ---
# notmuch and wacli also index document attachments / shared files by default
# (set `attachments = false` / `media = false` on the source to disable).

[[sources]]
name  = "mail"
type  = "notmuch"
db    = "/path/to/maildir"       # a notmuch-indexed maildir
query = "*"

[[sources]]
name = "chat"
type = "wacli"
db   = "/path/to/whatsapp.db"    # a wacli-shaped SQLite message store (opened read-only)
# The connector reads any store with this row shape; table and column names are all
# overridable (table, id_col, chat_col, ..., text_cols), so another archiver's export —
# e.g. a Slack archive exposing a compatible view — plugs in with config alone:
# table     = "messages_flat"
# text_cols = ["text"]
# tags      = ["slack", "attachment"]   # stamped on shared-document items (default: ["whatsapp", "attachment"])

[[sources]]
name  = "documents"
type  = "files"
roots = ["/path/to/documents", "/path/to/more/documents"]
